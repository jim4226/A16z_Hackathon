<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morph Studio</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%234aa3ff%22/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="brand">Morph <span>Studio</span></div>
  <div id="project" class="muted"></div>
  <div id="revs" class="revs"></div>
  <label class="toggle"><input type="checkbox" id="tour" checked> auto-tour changes</label>
</header>
<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="suggest"></div>
    <form id="form"><input id="input" autocomplete="off" placeholder="Ask for a change… e.g. “make it work for a strawberry”"><button>Send</button></form>
  </section>

  <section id="center">
    <div id="pipeline"></div>
    <nav id="tabs">
      <button data-tab="cad" class="on">3D design</button>
      <button data-tab="board">Electronics + PCB</button>
      <button data-tab="fab">Fab</button>
      <button data-tab="fw">Firmware</button>
      <button data-tab="sim">Simulation</button>
    </nav>
    <div id="views">
      <div class="view on" data-view="cad"><div id="cad3d" class="three"></div><div class="legend" id="cadLegend"></div></div>
      <div class="view" data-view="board"><div id="boardWrap"><svg id="board"></svg></div><div class="legend" id="boardLegend"></div></div>
      <div class="view" data-view="fab"><div id="fab3d" class="three"></div><div class="legend" id="fabLegend"></div></div>
      <div class="view" data-view="fw"><div id="fwHead" class="legend static"></div><pre id="fw"></pre></div>
      <div class="view" data-view="sim"><div id="simWrap"></div></div>
    </div>
  </section>

  <aside id="inspector">
    <h3>What changed</h3>
    <div id="changes" class="muted">—</div>
    <h3>Grip-force window</h3>
    <div id="window"></div>
    <h3>Predicted</h3>
    <table id="metrics"></table>
    <h3>Electronics</h3>
    <div id="elec"></div>
    <div id="issues"></div>
  </aside>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
