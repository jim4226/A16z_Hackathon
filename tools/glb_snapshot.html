<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#11151a;height:100%;overflow:hidden}#c{width:100vw;height:100vh}</style></head>
<body><div id="c"></div>
<script type="module">
// Minimal realistic GLB preview used by tools/snapshot.py: ?glb=<url>&az=<deg>&el=<deg>&dist=<factor>
import * as THREE from '/static/vendor/three.module.min.js';
import { GLTFLoader } from '/static/vendor/GLTFLoader.js';
import { RoomEnvironment } from '/static/vendor/RoomEnvironment.js';
const P = new URLSearchParams(location.search);
const el = document.getElementById('c');
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; el.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x11151a);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(300, 600, 400); sun.castShadow = true; scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 20000);
new GLTFLoader().load(P.get('glb'), (g) => {
  const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; root.add(g.scene); scene.add(root);  // z-up -> y-up
  g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true;
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 35), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
    o.add(e); } });
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
  const az = (+P.get('az') || 35) * Math.PI / 180, elv = (+P.get('el') || 20) * Math.PI / 180, d = s * (+P.get('dist') || 1.3);
  cam.position.set(c.x + d * Math.cos(elv) * Math.sin(az), c.y + d * Math.sin(elv), c.z + d * Math.cos(elv) * Math.cos(az));
  cam.lookAt(c);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(s * 4, s * 4), new THREE.MeshStandardMaterial({ color: 0x1b2129, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = box.min.y - 0.5; floor.receiveShadow = true; scene.add(floor);
  r.render(scene, cam); document.title = 'ready';
}, undefined, (e) => { document.title = 'error ' + e; });
</script></body></html>
