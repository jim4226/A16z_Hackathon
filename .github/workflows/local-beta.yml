name: Local beta package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      MUJOCO_GL: ${{ matrix.os == 'ubuntu-latest' && 'osmesa' || 'glfw' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Linux headless OpenGL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1 libglfw3
      - name: Install hashed dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Offline tests (external sockets and DNS blocked)
        run: python tools/run_offline_tests.py -q
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows' && matrix.python == '3.11'
        with:
          node-version: '22'
      - name: Install browser test tools
        if: runner.os == 'Windows' && matrix.python == '3.11'
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Browser onboarding and export smoke
        if: runner.os == 'Windows' && matrix.python == '3.11'
        run: node tools/browser_smoke.cjs
      - name: Build wheel, sdist and setup bundle
        run: python tools/build_release.py
      - name: Install wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rcubed-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            isolated="$RUNNER_TEMP/rcubed-wheel/Scripts/python.exe"
          else
            isolated="$RUNNER_TEMP/rcubed-wheel/bin/python"
          fi
          "$isolated" -m pip install --require-hashes -r requirements.lock
          "$isolated" -m pip install --no-deps dist/*.whl
          "$isolated" -m pip check
          "$isolated" -I tools/package_smoke.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        with:
          name: r-cubed-local-beta
          path: dist/*
          if-no-files-found: error
