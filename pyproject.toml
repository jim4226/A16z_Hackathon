[project]
name = "morph"
version = "0.1.0"
description = "Morph Studio: generate and edit a whole robot (CAD, simulation, electronics, manufacturing, sourcing, assembly)"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "shapely>=2", "manifold3d", "trimesh", "mujoco>=3", "pydantic>=2", "anthropic>=1.13", "pillow",
]

[project.optional-dependencies]
machines = ["pyserial", "requests"]
dev = ["pytest"]

[project.scripts]
morph = "morph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["morph*"]

[tool.setuptools.package-data]
"morph.studio" = ["static/*", "static/vendor/*", "static/fixtures/**/*"]
"morph.robot" = ["*.json"]
